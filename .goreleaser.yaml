# GoReleaser configuration for nano-llm-proxy.
#
# The release workflow (.github/workflows/release.yml) drives this. The GUI is
# expected to be built already — `web/dist` is embedded under the `prod` build
# tag, so the binary step below would fail on a clean checkout without it.

version: 2

project_name: nano-llm-proxy

before:
  hooks:
    - go mod tidy

builds:
  - id: nano-llm-proxy
    # Pure Go, no cgo: one static binary per platform, GUI embedded.
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -tags=prod
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - '7'
    ignore:
      # The Windows GUI is served over HTTP; a headless build is the norm.
      - goos: windows
        goarch: arm64
    # Always the bare project name inside the archive. The OS/arch
    # disambiguation belongs on the archive (see name_template below), not on
    # the extracted binary — a user who untars should be able to run
    # ./nano-llm-proxy, which is what the release notes tell them to do.
    # GoReleaser appends .exe on Windows itself (adding it here shipped
    # nano-llm-proxy.exe.exe in v0.2.0).
    binary: '{{ .ProjectName }}'

  # Windows GUI-subsystem twin of the main binary: identical code, but linked
  # with -H=windowsgui so local mode's background instance (started at sign-in
  # from the HKCU Run key) has no console window. Ships only in the Windows zip.
  - id: nano-llm-proxyw
    env:
      - CGO_ENABLED=0
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -tags=prod
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    goos:
      - windows
    goarch:
      - amd64
    binary: nano-llm-proxyw   # .exe is appended by GoReleaser

archives:
  - id: default
    # Binaries are grouped per platform: windows_amd64 gets both .exe files,
    # linux/darwin only nano-llm-proxy (nano-llm-proxyw has no such targets).
    ids:
      - nano-llm-proxy
      - nano-llm-proxyw
    # Intentional: two binaries on windows_amd64, one everywhere else.
    allow_different_binary_count: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}'
    files:
      - LICENSE
      - README.md
      - .env.example

checksum:
  name_template: checksums.txt

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^\s*ci:'
  groups:
    - title: Features
      regexp: '^.*?(feat|add|support|implement).*$'
    - title: Fixes
      regexp: '^.*?(fix|resolve|correct|handle).*$'
    - title: Security
      regexp: '^.*?(security|redact|vuln|CVE).*$'

release:
  draft: false
  prerelease: auto
  # The one-line installers fetch these from releases/latest/download/, so a
  # script always pairs with the binaries it was released with.
  extra_files:
    - glob: scripts/install/install.*
  header: |
    ## Install on your own computer (local mode)

    macOS, Linux, WSL:

    ```bash
    curl -fsSL https://github.com/kmmuntasir/nano-llm-proxy/releases/latest/download/install.sh | bash
    ```

    Windows PowerShell:

    ```powershell
    irm https://github.com/kmmuntasir/nano-llm-proxy/releases/latest/download/install.ps1 | iex
    ```

    Windows CMD:

    ```bat
    curl -fsSL https://github.com/kmmuntasir/nano-llm-proxy/releases/latest/download/install.cmd -o install.cmd && install.cmd && del install.cmd
    ```

    No admin rights needed. The installer verifies the download against
    `checksums.txt`, starts nano-llm-proxy in the background and opens
    `http://localhost:8787`. Re-run it to upgrade; `--uninstall` (`-Uninstall`
    on Windows) removes it.

    ## Installing on a server

    Download the binary for your platform, make it executable, and run it.

    ```bash
    tar xzf nano-llm-proxy_*_linux_amd64.tar.gz
    cp .env.example .env   # then set ADMIN_EMAIL and ADMIN_PASSWORD
    ./nano-llm-proxy
    ```

    The admin GUI is embedded in the binary — no Node, no container runtime,
    no database server. The only runtime state is a single `gateway.db`.

    See the [README](https://github.com/kmmuntasir/nano-llm-proxy#readme) for
    the full walkthrough, or `sudo ./deploy.sh` for a hardened systemd unit.

  footer: |
    ---

    Upstream provider accounts you configure remain subject to their own terms
    of service. Use keys you are authorized to use.
